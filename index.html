<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#091429">
  <title>動物園閉園だよ！</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <section id="titleScreen" class="screen active">
      <div class="card title-card">
        <img class="hero-image" src="title.png" alt="動物園閉園だよ！">
        <p class="lead">
          閉園時間なのに、まだ帰らないお客さん。<br>
          なぜか持っている「さすまた」で出口までご案内しよう！
        </p>
        <button id="startBtn" class="main-btn" type="button">閉園作業スタート！</button>
      </div>
    </section>

    <section id="gameScreen" class="screen">
      <div id="gameShell">
        <div id="hud">
          <div class="hud-box">
            <span class="hud-label">のこり</span>
            <span id="timeText" class="hud-value">60</span>
          </div>
          <div class="hud-box">
            <span class="hud-label">退園</span>
            <span id="scoreText" class="hud-value">0人</span>
          </div>
          <button id="gameTitleBtn" class="hud-title-btn" type="button">タイトルへ</button>
        </div>

        <div id="stageWrap">
          <canvas id="gameCanvas" width="540" height="960"></canvas>
          <div id="startOverlay" class="stage-message">閉園です！</div>
          <div id="floatingLayer" aria-hidden="true"></div>

          <div id="joystick" class="joystick" aria-label="移動用ジョイスティック">
            <div class="joystick-ring"></div>
            <div id="joystickKnob" class="joystick-knob"></div>
          </div>
        </div>
      </div>
    </section>

    <section id="resultScreen" class="screen">
      <div class="card result-card">
        <img class="hero-image" src="result.png" alt="閉園作業終了">
        <p class="result-label">閉園作業終了！</p>
        <div id="resultScore" class="result-score">0人退園！</div>

        <div id="resultButtons" class="resultButtons hidden">
          <button id="shareButton" class="resultButton" type="button">Xでシェア</button>
          <button id="registerButton" class="resultButton" type="button">記録を登録</button>
          <button id="retryButton" class="resultButton" type="button">もう1回遊ぶ</button>
          <button id="arcadeButton" class="resultButton" type="button">カバゲーセンへ</button>
        </div>
      </div>
    </section>
  </main>

  <audio id="bgm" src="bgm.mp3" preload="auto"></audio>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="game.js"></script>
</body>
</html>
