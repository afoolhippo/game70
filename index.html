<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#091429">
  <title>動物園閉園だよ！</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <!-- タイトル -->
    <section id="titleScreen" class="screen active">
      <div class="card">
        <img class="hero-image" src="title.png" alt="動物園閉園だよ！">
        <p class="lead">
          閉園時間なのに、まだ帰らないお客さん。<br>
          なぜか持っている「さすまた」で出口までご案内しよう！
        </p>
        <div class="howto">
          <p><b>移動：</b>上下左右ボタンでスタッフを動かす</p>
          <p><b>さすまた：</b>スタッフが向いている方向に構えたまま。先端が来園者に触れると、その方向へ自動でグイッと押し出す</p>
          <p><b>退園：</b>来園者を画面上部の出口まで押し出すと「退園！」</p>
          <p><b>制限時間：</b>60秒で何人退園させられるか！</p>
        </div>
        <button id="startBtn" class="main-btn">閉園作業スタート！</button>
      </div>
    </section>

    <!-- ゲーム -->
    <section id="gameScreen" class="screen">
      <div id="gameShell">
        <div id="hud">
          <div class="hud-box">
            <span class="hud-label">のこり</span>
            <span id="timeText" class="hud-value">60</span>
          </div>
          <div class="hud-box">
            <span class="hud-label">退園</span>
            <span id="scoreText" class="hud-value">0人</span>
          </div>
          <button id="gameTitleBtn" class="hud-title-btn" type="button">タイトルへ</button>
        </div>

        <div id="stageWrap">
          <canvas id="gameCanvas" width="540" height="960"></canvas>

          <div id="startOverlay" class="stage-message">閉園です！</div>
          <div id="floatingLayer" aria-hidden="true"></div>

          <!-- 左：移動 -->
          <div id="dpad" class="control-zone" aria-label="移動操作">
            <button class="dir-btn up" data-dir="up" aria-label="上">▲</button>
            <button class="dir-btn left" data-dir="left" aria-label="左">◀</button>
            <button class="dir-btn right" data-dir="right" aria-label="右">▶</button>
            <button class="dir-btn down" data-dir="down" aria-label="下">▼</button>
          </div>
        </div>
      </div>
    </section>

    <!-- 結果 -->
    <section id="resultScreen" class="screen">
      <div class="card result-card">
        <img class="hero-image" src="result.png" alt="閉園作業終了">
        <p class="result-label">閉園作業終了！</p>
        <div id="resultScore" class="result-score">退園 0人</div>
        <p id="resultComment" class="result-comment">おつかれさまでした。</p>
        <button id="retryBtn" class="main-btn">もう一回</button>
        <button id="titleBtn" class="sub-btn">タイトルに戻る</button>
      </div>
    </section>
  </main>

  <audio id="bgm" src="bgm.mp3" preload="auto"></audio>
  <script src="game.js"></script>
</body>
</html>
